name: Discord

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Build]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  notify:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Forward push event to Discord
        env:
          HOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::No DISCORD_WEBHOOK secret, skipped"
            exit 0
          fi
          curl -fsS -H "Content-Type: application/json" -H "X-GitHub-Event: push" \
            --data-binary @"$GITHUB_EVENT_PATH" "$HOOK"

  # No webhook here: Pillow comes from PyPI, installed only after the reports are saved.
  treemap:
    if: >-
      github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      prev_sha: ${{ steps.reports.outputs.prev_sha }}
      commits: ${{ steps.reports.outputs.commits }}
      site: ${{ steps.site.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Download reports
        id: reports
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -p '*_report' -D reports/cur
          read -r prev prev_sha <<< "$(gh run list -R "$GITHUB_REPOSITORY" -w Build -b main -e push -L 20 \
              --json databaseId,headSha,conclusion \
              --jq "[.[] | select(.databaseId < $RUN_ID and .conclusion == \"success\")][0] // empty | \"\\(.databaseId) \\(.headSha)\"")"
          if [ -n "$prev" ] && gh run download "$prev" -R "$GITHUB_REPOSITORY" -p '*_report' -D reports/prev; then
            echo "prev_sha=$prev_sha" >> "$GITHUB_OUTPUT"
            commits=$(gh api "repos/$GITHUB_REPOSITORY/compare/$prev_sha...$HEAD_SHA" --jq .total_commits 2>/dev/null) || commits=
            echo "commits=$commits" >> "$GITHUB_OUTPUT"
          else
            rm -rf reports/prev
          fi

      - name: Save reports
        uses: actions/upload-artifact@v4
        with:
          name: progress-reports
          path: reports
          retention-days: 1
          overwrite: true

      - name: Write badges
        id: badges
        continue-on-error: true
        run: python3 .github/progress.py --badges site reports/cur

      - name: Draw treemap
        continue-on-error: true
        timeout-minutes: 5
        run: |
          python3 -m pip install --break-system-packages -q pillow==12.3.0
          python3 .github/treemap.py reports/cur treemap.png $(test -d reports/prev && echo reports/prev)
          python3 .github/treemap.py reports/cur site/treemap.png

      - name: Save treemap
        uses: actions/upload-artifact@v4
        with:
          name: treemap
          path: treemap.png
          if-no-files-found: ignore
          retention-days: 1
          overwrite: true

      # Without its treemap, the site would replace the last one with nothing: keep the old site.
      - name: Save Pages site
        id: site
        if: steps.badges.outcome == 'success' && hashFiles('site/treemap.png') != ''
        continue-on-error: true
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 1

  # The README's treemap and badges. Only deploys: nothing from the repository or PyPI runs with the Pages token.
  pages:
    needs: treemap
    if: needs.treemap.outputs.site == 'success'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5

  progress:
    needs: treemap
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download reports
        uses: actions/download-artifact@v4
        with:
          name: progress-reports
          path: reports

      - name: Download treemap
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: treemap

      - name: Post progress to Discord
        env:
          PUSHER: ${{ github.event.workflow_run.actor.login }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PREV_SHA: ${{ needs.treemap.outputs.prev_sha }}
          COMMITS: ${{ needs.treemap.outputs.commits }}
          HOOK: ${{ secrets.DISCORD_PROGRESS_WEBHOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::No DISCORD_PROGRESS_WEBHOOK secret, skipped"
            exit 0
          fi
          python3 .github/progress.py reports/cur $(test -d reports/prev && echo reports/prev) > payload.json
          if [ ! -s payload.json ]; then
            echo "No progress change, skipped"
            exit 0
          fi
          if [ ! -s treemap.png ] || ! curl -fsS -F "payload_json=<payload.json" -F "files[0]=@treemap.png;type=image/png" "$HOOK"; then
            curl -fsS -H "Content-Type: application/json" --data-binary @payload.json "$HOOK"
          fi
